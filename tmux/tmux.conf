set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

unbind r
bind r source-file ~/.tmux.conf

bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5
bind h resize-pane -L 5

bind -r m resize-pane -Z

set -g mouse on

# start window/pane numbering at 1 and renumber on close
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "pbcopy" # "y" copies to macOS clipboard
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

# Option + Left Arrow: Move one word left
bind-key -n M-Left send-keys M-b
# Option + Right Arrow: Move one word right
bind-key -n M-Right send-keys M-f

# vim-tmux-navigator claims C-l for pane navigation; C-a C-l clears the screen
bind C-l send-keys 'C-l'

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

# let Neovim receive focus events (needed for gitsigns/autoread)
set -g focus-events on

set -g history-limit 100000

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
set -g @plugin 'dracula/tmux'

# dracula theme — Dracula Pro palette
# variants: pro, blade, buffy, lincoln, morbius, van_helsing, alucard (light)
# switch by changing the file below, then C-a r
source-file ~/development/dotfiles/tmux/dracula-pro/pro.conf

set -g @dracula-plugins "git"
set -g @dracula-show-powerline true
set -g @dracula-show-left-icon session
set -g @dracula-show-flags true
set -g @dracula-git-disable-status false
set -g @dracula-git-show-current-symbol ✓
set -g @dracula-refresh-rate 5

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
